name: C++ correctness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: make test
      - run: make sanitize
      - run: make build/benchmark && ./build/benchmark 10000 1 build/smoke > build/smoke.csv
